[project]
name = "uradmonitor-homeassistant"
version = "2026.08.1"
description = "Home Assistant integration for uradmonitor sensors"
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["homeassistant>=2026.8.0,<2026.9.0"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13.0",
  "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
