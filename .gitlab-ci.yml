stages:
  - quality
  - release

default:
  image: python:3.14
  cache:
    paths:
      - .cache/pip

quality:
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - pip install uv
    - uv sync --dev
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest
    - python -m json.tool custom_components/uradmonitor/manifest.json >/dev/null
    - python -m json.tool custom_components/uradmonitor/translations/en.json >/dev/null
    - python -m json.tool custom_components/uradmonitor/translations/sv.json >/dev/null
    - python -m json.tool custom_components/uradmonitor/strings.json >/dev/null

release-to-github:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d{4}\.\d{2}\.\d+/'
  script:
    - test -n "$GITHUB_TOKEN"
    - test -n "$GH_REPOSITORY"
    - apt-get update -qq && apt-get install -y -qq git curl
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@github.com/${GH_REPOSITORY}.git"
    - cp README.github.md README.md
    - git config user.name "GitLab mirror bot"
    - git config user.email "gitlab-mirror@noreply.invalid"
    - git add README.md
    - git commit -m "Update GitHub mirror README"
    # GitHub main may contain the mirror-only README commit. The main branch
    # is synchronized by mirror-main-to-github; release tags are pushed
    # independently so they do not require a fast-forward main update.
    - git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
    - >-
      curl --fail --request POST
      --header "Authorization: Bearer ${GITHUB_TOKEN}"
      --header "Accept: application/vnd.github+json"
      --data "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"${CI_COMMIT_TAG}\",\"generate_release_notes\":true}"
      "https://api.github.com/repos/${GH_REPOSITORY}/releases"

mirror-main-to-github:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - test -n "$GITHUB_TOKEN"
    - test -n "$GH_REPOSITORY"
    - apt-get update -qq && apt-get install -y -qq git
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@github.com/${GH_REPOSITORY}.git"
    - cp README.github.md README.md
    - git config user.name "GitLab mirror bot"
    - git config user.email "gitlab-mirror@noreply.invalid"
    - git add README.md
    - git commit -m "Update GitHub mirror README"
    # GitHub main contains the mirror-only README commit, so it is not a
    # fast-forward of GitLab main. GitLab is the canonical source of truth.
    - git fetch github main
    - git push --force-with-lease=refs/heads/main github "HEAD:refs/heads/main"
